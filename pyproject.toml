[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hybrid-rag"
version = "0.1.0"
description = "Technical-document RAG ingestion"
requires-python = ">=3.11"
dependencies = ["pydantic>=2,<3", "PyYAML>=6,<7", "markdown-it-py>=3,<5", "langchain-text-splitters>=0.3,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "markdown-it-py>=3,<5"]
analysis = ["transformers>=4,<6", "tokenizers>=0.20,<1", "sentencepiece>=0.2,<1"]
retrieval = ["sentence-transformers>=5,<7", "qdrant-client>=1.16,<2", "llama-index-core>=0.12,<0.13", "llama-index-retrievers-bm25>=0.5,<0.6", "numpy>=1.26,<3"]
api = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1"]
generation = ["langchain-openai>=0.3,<2", "langchain-deepseek>=0.1,<2", "langchain-anthropic>=0.3,<2", "python-dotenv>=1,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
